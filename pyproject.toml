[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quino"
version = "0.1.0"
description = "Library-first 2D mechanism modeling toolkit"
readme = "docs/Specification.md"
requires-python = ">=3.11"
dependencies = [
    "python-solvespace>=3.0",
]

[project.scripts]
quino-gui = "quino.gui.app:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
gui = [
    "PySide6>=6.6",
]
solver = [
    "exudyn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
