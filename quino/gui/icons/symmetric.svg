<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- axis line -->
  <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- left point -->
  <circle cx="5" cy="12" r="2.5" fill="currentColor"/>
  <!-- right point (mirror) -->
  <circle cx="19" cy="12" r="2.5" fill="currentColor"/>
  <!-- dashed mirror lines -->
  <line x1="5" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="12" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2,2"/>
</svg>
