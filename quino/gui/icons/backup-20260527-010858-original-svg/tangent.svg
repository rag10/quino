<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- circle -->
  <circle cx="10" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- tangent line touching at top of circle -->
