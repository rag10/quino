  <!-- plus badge top-right (new) -->
  <circle cx="26" cy="9" r="6" fill="#faf8f2" stroke="#3d3d3d" stroke-width="1.5"/>
  <line x1="26" y1="5.5" x2="26" y2="12.5" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round"/>
